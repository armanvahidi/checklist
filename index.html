<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checklist</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f6; }
    header { padding: 12px; background: #fff; border-bottom: 1px solid #ddd; }
    main { padding: 12px; max-width: 700px; margin: auto; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    input, button, select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border-top: 1px solid #eee; padding: 8px 0; }
    .done { text-decoration: line-through; opacity: 0.6; }
    .row { display: flex; gap: 8px; }
    .grow { flex: 1; }
  </style>
</head>
<body>

<header>
  <h2>Checklist</h2>
</header>

<main>

  <div id="authBox" class="card">
    <input id="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Login / Sign up</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <div id="app" style="display:none;">

    <div class="card">
      <h3>Lists</h3>
      <div class="row">
        <input id="newListTitle" class="grow" placeholder="New list title" />
        <button id="addListBtn">Add</button>
      </div>
      <br/>
      <div class="row">
        <select id="listSelect" class="grow"></select>
        <button id="deleteListBtn">Delete</button>
      </div>
    </div>

    <div class="card">
      <h3>Items</h3>
      <div class="row">
        <input id="newItemText" class="grow" placeholder="New item..." />
        <button id="addItemBtn">Add</button>
      </div>
      <ul id="itemsList"></ul>
    </div>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // =========================
  // CONFIG — PUT YOUR KEYS HERE
  // =========================
  const SUPABASE_URL = "https://jifxrvcvruwanqgxgghw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MABvndEcuO3H7srlzVzqPg_neN-lYzK";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // =========================
  // AUTH
  // =========================
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const appDiv = document.getElementById("app");

  loginBtn.onclick = async () => {
    const email = emailInput.value;
    const password = passwordInput.value;

    let { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) {
      const res = await supabase.auth.signUp({ email, password });
      if (res.error) alert(res.error.message);
    }
    refreshSession();
  };

  logoutBtn.onclick = async () => {
    await supabase.auth.signOut();
    location.reload();
  };

  async function refreshSession() {
    const { data } = await supabase.auth.getSession();
    if (data.session) {
      document.getElementById("authBox").style.display = "none";
      appDiv.style.display = "block";
      logoutBtn.style.display = "inline-block";
      await loadFromSupabase();
    }
  }

  // =========================
  // APP STATE
  // =========================
  let state = { lists: [], selectedListId: null };

  const newListTitle = document.getElementById("newListTitle");
  const addListBtn = document.getElementById("addListBtn");
  const listSelect = document.getElementById("listSelect");
  const deleteListBtn = document.getElementById("deleteListBtn");

  const newItemText = document.getElementById("newItemText");
  const addItemBtn = document.getElementById("addItemBtn");
  const itemsList = document.getElementById("itemsList");

  const getSelectedList = () => state.lists.find(l => l.id === state.selectedListId);

  // =========================
  // LOAD
  // =========================
  async function loadFromSupabase() {
    const { data: { user } } = await supabase.auth.getUser();

    const { data } = await supabase
      .from("lists")
      .select("id, title, items(id, text, done)")
      .eq("user_id", user.id)
      .order("created_at");

    state.lists = data || [];
    state.selectedListId = state.lists[0]?.id || null;
    render();
  }

  // =========================
  // RENDER
  // =========================
  function render() {
    listSelect.innerHTML = "";
    state.lists.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l.id;
      opt.textContent = l.title;
      if (l.id === state.selectedListId) opt.selected = true;
      listSelect.appendChild(opt);
    });

    itemsList.innerHTML = "";
    const list = getSelectedList();
    if (!list) return;

    list.items.forEach(item => {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      li.textContent = item.text + " ";

      const c = document.createElement("button");
      c.textContent = "Complete";
      c.onclick = () => setDone(item.id, true);

      const i = document.createElement("button");
      i.textContent = "Incomplete";
      i.onclick = () => setDone(item.id, false);

      const d = document.createElement("button");
      d.textContent = "Delete";
      d.onclick = () => deleteItem(item.id);

      li.append(" ", c, " ", i, " ", d);
      itemsList.appendChild(li);
    });
  }

  // =========================
  // ACTIONS
  // =========================
  addListBtn.onclick = async () => {
    const title = newListTitle.value.trim();
    if (!title) return;
    const { data: { user } } = await supabase.auth.getUser();
    await supabase.from("lists").insert({ title, user_id: user.id });
    newListTitle.value = "";
    await loadFromSupabase();
  };

  deleteListBtn.onclick = async () => {
    const list = getSelectedList();
    if (!list) return;
    await supabase.from("lists").delete().eq("id", list.id);
    await loadFromSupabase();
  };

  addItemBtn.onclick = async () => {
    const text = newItemText.value.trim();
    if (!text) return;
    const list = getSelectedList();
    await supabase.from("items").insert({ list_id: list.id, text, done: false });
    newItemText.value = "";
    await loadFromSupabase();
  };

  async function setDone(id, done) {
    await supabase.from("items").update({ done }).eq("id", id);
    await loadFromSupabase();
  }

  async function deleteItem(id) {
    await supabase.from("items").delete().eq("id", id);
    await loadFromSupabase();
  }

  listSelect.onchange = () => {
    state.selectedListId = listSelect.value;
    render();
  };

  // =========================
  // START
  // =========================
  refreshSession();
</script>

</body>
</html>
