  <title>Checklist</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f6f6f6; }
    header { padding: 12px; background: #fff; border-bottom: 1px solid #ddd; }
    main { padding: 12px; max-width: 700px; margin: auto; }
    .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    input, button, select { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    button { cursor: pointer; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { border-top: 1px solid #eee; padding: 8px 0; }
    .done { text-decoration: line-through; opacity: 0.6; }
    .row { display: flex; gap: 8px; }
    .grow { flex: 1; }
  </style>
</head>
<body>

<header>
  <h2>Checklist</h2>
</header>

<main>

  <div id="authBox" class="card">
    <div class="row">
      <input id="email" class="grow" placeholder="Email" />
      <button id="sendCodeBtn">Send code</button>
    </div>

    <div class="row" style="margin-top:8px;">
      <input id="code" class="grow" placeholder="6-digit code" inputmode="numeric" />
      <button id="verifyCodeBtn">Verify</button>
    </div>

    <div id="authMsg" style="margin-top:8px; font-size:12px;"></div>
    <button id="logoutBtn" style="display:none; margin-top:10px;">Logout</button>
  </div>

  <!-- THIS WAS MISSING IN YOUR FILE -->
  <div id="app" style="display:none;">

    <!-- LISTS (your JS/database relies on this) -->
    <div class="card">
      <h3>Lists</h3>
      <div class="row">
        <input id="newListTitle" class="grow" placeholder="New list title (e.g. Shopping)" />
        <button id="addListBtn">Add</button>
      </div>

      <div class="row" style="margin-top:8px;">
        <select id="listSelect" class="grow"></select>
        <button id="deleteListBtn">Delete</button>
      </div>

      <div id="dbMsg" style="margin-top:8px; font-size:12px;"></div>
    </div>

    <div class="card">
      <h3>Items</h3>
      <div class="row">
        <input id="newItemText" class="grow" placeholder="New item..." />
        <button id="addItemBtn">Add</button>
      </div>
      <ul id="itemsList"></ul>
    </div>

  </div>
</main>

    document.getElementById("authMsg").textContent = "SCRIPT LOADED: " + new Date().toISOString();

    const btn = document.getElementById("sendCodeBtn");
    
    btn.addEventListener("click", () => alert("Send code handler attached"));

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>


<script>
  const authMsg = document.getElementById("authMsg");

  function setMsg(s) {
    authMsg.textContent = s;
    console.log(s);
  }

  setMsg("Script started");

  if (!window.supabase) {
    setMsg("ERROR: Supabase library not loaded");
    throw new Error("Supabase not loaded");
  }

  setMsg("Supabase library loaded");

  const SUPABASE_URL = "https://jifxrvcvruwanqgxgghw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_MABvndEcuO3H7srlzVzqPg_neN-lYzK";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  setMsg("Supabase client created");

  const sendCodeBtn = document.getElementById("sendCodeBtn");
  const emailInput = document.getElementById("email");

  sendCodeBtn.addEventListener("click", async () => {
    alert("Button clicked");
    const email = emailInput.value.trim();

    if (!email) {
      setMsg("Enter an email");
      return;
    }

    setMsg("Calling Supabase...");

    try {
      const res = await supabase.auth.signInWithOtp({
        email,
        options: {
          shouldCreateUser: true,
          emailRedirectTo: window.location.href
        }
      });

      console.log("Supabase response:", res);

      if (res.error) {
        setMsg("Supabase error: " + res.error.message);
      } else {
        setMsg("Supabase accepted request. Check email (and spam).");
      }
    } catch (e) {
      console.error(e);
      setMsg("Exception: " + (e.message || e));
    }
  });

  setMsg("Handler attached. Ready.");
  
</script>
